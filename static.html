<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commencement 27 Portrait Countdown</title>
<style>
:root {
  --green:#046A38;
  --gold:#C99700;
  --black:#101820;
  --black-top:#1b252d;
  --black-bottom:#0c1318;
  --white:#f7f7f2;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101820;overflow:hidden;}
body{font-family:Arial,Helvetica,sans-serif;color:white;}

/* 
  FIX: Hardware Rotation Canvas Trick.
  This forces a 1920x1080 canvas to rotate 90 degrees, filling the vertical TV perfectly.
*/
.screen {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 1920px;   /* Physical TV height */
  height: 1080px;  /* Physical TV width */
  margin: 0;
  padding: 60px 40px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 0;
  overflow: hidden;
  
  /* The Magic Trick: Rotates the code to match your hung TV direction */
  transform: translate(-50%, -50%) rotate(90deg);
  transform-origin: center center;
  
  background:
    radial-gradient(circle at 20% 76%, rgba(201,151,0,.18), transparent 16%),
    radial-gradient(circle at 82% 72%, rgba(255,255,255,.07), transparent 17%),
    linear-gradient(180deg,#075f35 0%,#004b2b 52%,#003b25 100%);
}

.screen::before{
  content:"";
  position:absolute;
  left:-100px; right:-100px; top:250px;
  height:3px;
  background:var(--gold);
  transform:rotate(-7deg);
  opacity:.9;
  z-index: 1;
}

.official-nova {
  position:relative;
  z-index:3;
  width:94%;
  margin:0 auto 40px;
  padding:25px 40px;
  background:#fff;
  box-shadow:0 5px 18px rgba(0,0,0,.10);
  display: flex;
  justify-content: center;
  align-items: center;
}
.official-nova img{display:block;width:100%;max-width:800px;height:auto;}

.logo-wrap {
  position:relative;
  z-index:3;
  margin:20px 0 65px;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}
.logo-wrap img{display:block;width:100%;max-width:960px;height:auto;}

/* Groups the digits into tight visual blocks */
.countdown {
  position:relative;
  z-index:4;
  margin:0 auto 60px;
  width: 100%;
  max-width:980px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap: 45px; 
}
.unit {
  text-align:center;
}
.digits {
  display:flex;
  justify-content:center;
  gap:6px; 
}
.flip-card {
  position:relative;
  width:82px;
  height:114px;
  perspective:1400px;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.30));
}
.card-half,.flip-half {
  position:absolute;left:0;width:100%;height:50%;overflow:hidden;
  backface-visibility:hidden;color:#f2c14e;background:var(--black);
}
.card-half.top,.flip-half.top {
  top:0;border-radius:12px 12px 2px 2px;
  background:linear-gradient(180deg,var(--black-top),var(--black));
  border-bottom:1px solid #05090c;
}
.card-half.bottom,.flip-half.bottom {
  bottom:0;border-radius:2px 2px 12px 12px;
  background:linear-gradient(180deg,var(--black),var(--black-bottom));
  border-top:1px solid rgba(255,255,255,.03);
}
.card-half span,.flip-half span {
  position:absolute;left:0;width:100%;height:200%;
  display:flex;align-items:center;justify-content:center;
  font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
  font-size:84px;font-weight:800;line-height:1;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #000;
}
.top span{top:0} .bottom span{bottom:0}
.flip-half.top{z-index:6;transform-origin:bottom}
.flip-half.bottom{z-index:5;transform-origin:top;transform:rotateX(90deg)}
.flip-card.flipping .flip-half.top{animation:flipTop .28s cubic-bezier(.55,.05,.85,.35) forwards}
.flip-card.flipping .flip-half.bottom{animation:flipBottom .28s .28s cubic-bezier(.15,.45,.25,1) forwards}
@keyframes flipTop{0%{transform:rotateX(0);filter:brightness(1)}100%{transform:rotateX(-90deg);filter:brightness(.62)}}
@keyframes flipBottom{0%{transform:rotateX(90deg);filter:brightness(.62)}100%{transform:rotateX(0);filter:brightness(1)}}
.seam {position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-1px);background:#06090b;box-shadow:0 1px 0 rgba(255,255,255,.05);z-index:10;}
.label {color:white;margin-top:15px;font-size:18px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;}

.date-row {position:relative;z-index:4;width:100%;display:flex;align-items:center;gap:25px;margin-bottom:20px;padding:0 40px;}
.rule{flex:1;height:4px;background:var(--gold)}
.date {white-space:nowrap;text-align:center;font-size:48px;line-height:1;font-weight:800;letter-spacing:.015em;}

.lower-art{
  position:relative;z-index:1;flex:1;width:100%;margin-top:30px;min-height:350px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  border-top:3px solid rgba(201,151,0,.9);
}
.lower-art::before{content:"";position:absolute;left:0;right:0;bottom:0;top:0;width:100%;height:100%;background:radial-gradient(circle at 50% 120%, rgba(201,151,0,.18), transparent 48%),linear-gradient(180deg,rgba(0,59,37,.05),rgba(0,35,24,.58));}
.lower-art img{position:absolute;right:50%;bottom:50%;transform:translate(50%,50%);width:460px;height:auto;max-height:250px;object-fit:contain;opacity:.14;mix-blend-mode:screen;filter:saturate(.6);}

.tagline, .year-mark, .nova {display:none!important;}
</style>
</head>
<body>
<div class="screen">
  <!-- Image Paths Fixed for GitHub Repository Root Routing -->
  <div class="./official-nova"><img src="official-logo.png" alt="Official Logo"></div>
  <div class="logo-wrap"><img src="main-theme-logo.png" alt="Commencement Theme Graphic"></div>
  
  <div class="countdown" id="countdownContainer">
    <div class="unit"><div class="digits" id="days-box"></div><div class="label">Days</div></div>
    <div class="unit"><div class="digits" id="hours-box"></div><div class="label">Hours</div></div>
    <div class="unit"><div class="digits" id="minutes-box"></div><div class="label">Minutes</div></div>
    <div class="unit"><div class="digits" id="seconds-box"></div><div class="label">Seconds</div></div>
  </div>

  <div class="date-row"><div class="rule"></div><div class="date">MAY 14 - 17, 2027</div><div class="rule"></div></div>
  <div class="lower-art"><img src="institutional-seal.png" alt="Institutional Crest Silhouette"></div>
</div>

<script>
const targetDate = new Date("May 14, 2027 09:00:00").getTime();
function createFlipCardHtml(initialVal) {
  return `<div class="flip-card"><div class="card-half top"><span>${initialVal}</span></div><div class="card-half bottom"><span>${initialVal}</span></div><div class="flip-half top"><span>${initialVal}</span></div><div class="flip-half bottom"><span>${initialVal}</span></div><div class="seam"></div></div>`;
}
let initialSetup = true;
const trackingMap = {
  days: { container: document.getElementById("days-box"), count: 3, lastStr: "" },
  hours: { container: document.getElementById("hours-box"), count: 2, lastStr: "" },
  minutes: { container: document.getElementById("minutes-box"), count: 2, lastStr: "" },
  seconds: { container: document.getElementById("seconds-box"), count: 2, lastStr: "" }
};
function updateSegment(key, targetValue) {
  const meta = trackingMap[key];
  const valueString = String(targetValue).padStart(meta.count, '0');
  if (initialSetup) {
    let composition = "";
    for(let i=0; i < meta.count; i++) { composition += createFlipCardHtml(valueString[i]); }
    meta.container.innerHTML = composition;
    meta.lastStr = valueString;
    return;
  }
  for (let i = 0; i < valueString.length; i++) {
    if (valueString[i] !== meta.lastStr[i]) {
      const card = meta.container.children[i];
      if (!card) continue;
      const newVal = valueString[i];
      card.querySelector('.card-half.top span').textContent = newVal;
      card.querySelector('.card-half.bottom span').textContent = meta.lastStr[i];
      card.querySelector('.flip-half.top span').textContent = meta.lastStr[i];
      card.querySelector('.flip-half.bottom span').textContent = newVal;
      card.classList.remove('flipping');
      void card.offsetWidth;
      card.classList.add('flipping');
    }
  }
  meta.lastStr = valueString;
}
function processClockTick() {
  const currentMoment = new Date().getTime();
  const diff = targetDate - currentMoment;
  let days = 0, hours = 0, minutes = 0, seconds = 0;
  if (diff > 0) {
    days = Math.floor(diff / (1000 * 60 * 60 * 24));
    hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    seconds = Math.floor((diff % (1000 * 60)) / 1000);
  }
  updateSegment("days", days);
  updateSegment("hours", hours);
  updateSegment("minutes", minutes);
  updateSegment("seconds", seconds);
  if (initialSetup) initialSetup = false;
}
processClockTick();
setInterval(processClockTick, 1000);

/* Safe resizing trigger cycle to act as a soft heartbeat stay-awake hook */
setInterval(function() {
  window.dispatchEvent(new Event('resize'));
}, 30000);
</script>
</body>
</html>
