<title>Commencement 27 Portrait Countdown</title>
<style>
:root {
  --green:#046A38;
  --gold:#C99700;
  --black:#101820;
  --black-top:#1b252d;
  --black-bottom:#0c1318;
  --white:#f7f7f2;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--green);}
body{font-family:Arial,Helvetica,sans-serif;color:white;overflow:hidden;}
 
.screen {
  width:100vh;
  height:100vw;
  min-height:100vw;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:0;
  padding:3vw 4vh 3vw;
  background:var(--green);
}
 
.nova {
  text-align:center;
  font-weight:800;
  letter-spacing:.14em;
  font-size:clamp(18px,2.2vh,42px);
  line-height:1.15;
}
.nova span {
  display:block;
  margin-top:.55em;
  font-size:.48em;
  letter-spacing:.24em;
  font-weight:700;
}
 
.logo-wrap {
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-top:1vw;
}
.logo-wrap img {
  display:block;
  width:min(90vh,950px);
  height:auto;
}
 
.countdown {
  width:100%;
  display:grid;
  grid-template-columns:1.18fr .92fr .92fr .92fr;
  gap:1.2vh;
  align-items:center;
  justify-items:center;
}
 
.unit {text-align:center;width:100%;}
.digits {
  display:flex;
  justify-content:center;
  gap:.55vh;
}
 
.flip-card {
  position:relative;
  width:clamp(48px,7.25vh,88px);
  height:clamp(66px,9.4vh,114px);
 
  perspective:1400px;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.30));
}
.card-half,.flip-half {
  position:absolute;left:0;width:100%;height:50%;overflow:hidden;
  backface-visibility:hidden;color:var(--white);background:var(--black);
}
.card-half.top,.flip-half.top {
  top:0;border-radius:12px 12px 2px 2px;
  background:linear-gradient(180deg,var(--black-top),var(--black));
  border-bottom:1px solid #05090c;
}
.card-half.bottom,.flip-half.bottom {
  bottom:0;border-radius:2px 2px 12px 12px;
  background:linear-gradient(180deg,var(--black),var(--black-bottom));
  border-top:1px solid rgba(255,255,255,.03);
}
.card-half span,.flip-half span {
  position:absolute;left:0;width:100%;height:200%;
  display:flex;align-items:center;justify-content:center;
  font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
  font-size:clamp(43px,7.05vh,84px);font-weight:800;line-height:1;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #000;
}
.top span{top:0} .bottom span{bottom:0}
.flip-half.top{z-index:6;transform-origin:bottom}
.flip-half.bottom{z-index:5;transform-origin:top;transform:rotateX(90deg)}
.flip-card.flipping .flip-half.top{animation:flipTop .28s cubic-bezier(.55,.05,.85,.35) forwards}
.flip-card.flipping .flip-half.bottom{animation:flipBottom .28s .28s cubic-bezier(.15,.45,.25,1) forwards}
@keyframes flipTop{0%{transform:rotateX(0);filter:brightness(1)}100%{transform:rotateX(-90deg);filter:brightness(.62)}}
@keyframes flipBottom{0%{transform:rotateX(90deg);filter:brightness(.62)}100%{transform:rotateX(0);filter:brightness(1)}}
.seam {
  position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-1px);
  background:#06090b;box-shadow:0 1px 0 rgba(255,255,255,.05);z-index:10;
}
.label {
  margin-top:1.2vw;font-size:clamp(11px,1.75vh,24px);
  font-weight:800;letter-spacing:.18em;
  color:var(--gold);
}
 
.date-row {
  width:100%;display:flex;align-items:center;gap:2.5vh;
}
.rule{flex:1;height:5px;background:var(--gold)}
.date {
  white-space:nowrap;text-align:center;font-size:clamp(26px,4vh,54px);
  line-height:1;font-weight:800;letter-spacing:.015em;
}
.tagline {
  margin-top:auto;
  margin-bottom:1vw;
  font-size:clamp(18px,2.2vh,32px);
  letter-spacing:.12em;text-transform:uppercase;font-weight:700;text-align:center;
}
.year-mark {
  font-size:clamp(100px,22vh,270px);
  font-weight:900;
  line-height:.82;
  letter-spacing:-.06em;
  color:rgba(255,255,255,.07);
  margin-top:2vw;
  user-select:none;
}
.sr-only {
  position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
  margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;border:0!important;
}
 
/* Optimized specifically for a portrait 9:16 display */
@media (orientation:landscape) {
  .screen{padding-left:5vh;padding-right:5vh}

#portrait-tv-rotation .clean-bokeh .l15{width:7vh;height:7vh;left:47%;top:12%;animation:softBokehC 7.8s ease-in-out -5.2s infinite}
#portrait-tv-rotation .clean-bokeh .l16{width:19vh;height:19vh;left:4%;top:82%;animation:softBokehA 9.7s ease-in-out -1.9s infinite}
#portrait-tv-rotation .clean-bokeh .l17{width:12vh;height:12vh;left:94%;top:72%;animation:softBokehB 8.8s ease-in-out -6.3s infinite}

<style id="bokeh-depth-polish">
/* DEPTH: larger/closer lights are softer and dimmer */
#portrait-tv-rotation .clean-bokeh .l2,
#portrait-tv-rotation .clean-bokeh .l6,
#portrait-tv-rotation .clean-bokeh .l11,
#portrait-tv-rotation .clean-bokeh .l16{
  filter:blur(10px) !important;
}
#portrait-tv-rotation .clean-bokeh .l3,
#portrait-tv-rotation .clean-bokeh .l8,
#portrait-tv-rotation .clean-bokeh .l15{
  filter:blur(4px) !important;
}
 
/* Slight temperature variation — still firmly NOVA gold */
#portrait-tv-rotation .clean-bokeh .warm{
  background:radial-gradient(circle,
    rgba(255,244,194,.88) 0%,
    rgba(244,205,92,.58) 16%,
    rgba(213,170,54,.28) 35%,
    rgba(183,151,51,.10) 54%,
    rgba(183,151,51,0) 75%) !important;
}
#portrait-tv-rotation .clean-bokeh .champagne{
  background:radial-gradient(circle,
    rgba(255,255,225,.90) 0%,
    rgba(246,229,144,.57) 16%,
    rgba(211,199,92,.27) 35%,
    rgba(173,180,77,.10) 54%,
    rgba(173,180,77,0) 75%) !important;
}
#portrait-tv-rotation .clean-bokeh .greenGold{
  background:radial-gradient(circle,
    rgba(239,247,196,.80) 0%,
    rgba(210,219,111,.48) 18%,
    rgba(166,190,78,.22) 38%,
    rgba(132,166,70,.08) 57%,
    rgba(132,166,70,0) 76%) !important;
}
 
/* Huge, faint edge bokeh — mostly off-screen for photographic depth */
#portrait-tv-rotation .clean-bokeh .edge1{
  width:29vh !important;height:29vh !important;
  left:-11%;top:24%;
  filter:blur(15px) !important;
  animation:edgeGlow1 13.7s ease-in-out -5.4s infinite !important;
}
#portrait-tv-rotation .clean-bokeh .edge2{
  width:34vh !important;height:34vh !important;
  left:88%;top:57%;
  filter:blur(17px) !important;
  animation:edgeGlow2 16.1s ease-in-out -10.8s infinite !important;
}
@keyframes edgeGlow1{
  0%,100%{opacity:0;transform:translate(-8px,0) scale(.96)}
  24%{opacity:.08}
  49%{opacity:.19;transform:translate(5px,7px) scale(1.04)}
  72%{opacity:.13}
  90%{opacity:0;transform:translate(10px,10px) scale(1.02)}
}
@keyframes edgeGlow2{
  0%,100%{opacity:0;transform:translate(7px,0) scale(.95)}
  22%{opacity:.07}
  52%{opacity:.16;transform:translate(-7px,-6px) scale(1.05)}
  76%{opacity:.11}
  91%{opacity:0;transform:translate(-11px,-9px) scale(1.01)}
}
 
/* Almost imperceptible green breathing underneath the bokeh */
#portrait-tv-rotation .screen::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(ellipse at 50% 44%,
    rgba(28,128,76,.10) 0%,
    rgba(7,92,56,.035) 52%,
    rgba(0,47,29,0) 84%);
  animation:greenBreath 29s ease-in-out infinite;
}
@keyframes greenBreath{
  0%,100%{opacity:.18}
  50%{opacity:.62}
}
</style>
 
 
<style id="final-background-polish">
/* Slightly richer perimeter vignette — keeps the emerald background, just adds depth. */
#portrait-tv-rotation .screen::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 43%,
      rgba(0,0,0,0) 38%,
      rgba(0,24,14,.06) 65%,
      rgba(0,18,11,.16) 100%);
}
 
/* Three tiny distant lights for another depth plane. */
#portrait-tv-rotation .clean-bokeh .distant{
  width:3.6vh !important;
  height:3.6vh !important;
  filter:blur(3px) !important;
  background:radial-gradient(circle,
    rgba(255,253,218,.76) 0%,
    rgba(241,220,119,.38) 20%,
    rgba(202,188,76,.12) 48%,
    rgba(202,188,76,0) 72%) !important;
}
#portrait-tv-rotation .clean-bokeh .d1{
  left:57%;top:10%;
  animation:finalTiny1 11.2s ease-in-out -4.1s infinite !important;
}
#portrait-tv-rotation .clean-bokeh .d2{
  left:6%;top:57%;
  animation:finalTiny2 8.8s ease-in-out -6.5s infinite !important;
}
#portrait-tv-rotation .clean-bokeh .d3{
  left:86%;top:91%;
  animation:finalTiny3 12.4s ease-in-out -2.7s infinite !important;
}
@keyframes finalTiny1{
  0%,100%{opacity:0;transform:scale(.92)}
  28%{opacity:.18}
  52%{opacity:.40;transform:translate(3px,2px) scale(1.05)}
  80%{opacity:.13}
}
@keyframes finalTiny2{
  0%,100%{opacity:0;transform:scale(.94)}
  24%{opacity:.15}
  49%{opacity:.36;transform:translate(2px,-3px) scale(1.06)}
  78%{opacity:.12}
}
@keyframes finalTiny3{
  0%,100%{opacity:0;transform:scale(.93)}
  31%{opacity:.17}
  56%{opacity:.38;transform:translate(-3px,-2px) scale(1.05)}
  82%{opacity:.11}
}
</style>
 
 
<style id="date-genius-overlay-fix">

<script>
const target = new Date("2027-05-17T11:00:00-04:00").getTime();
const widths = {days:3,hours:2,minutes:2,seconds:2};
const groups = {};
 
function createCard(initial){
  const card=document.createElement("div");
  card.className="flip-card"; card.dataset.value=initial;
  card.innerHTML=`<div class="card-half top static-top"><span>${initial}</span></div>
  <div class="card-half bottom static-bottom"><span>${initial}</span></div>
  <div class="flip-half top flip-top"><span>${initial}</span></div>
  <div class="flip-half bottom flip-bottom"><span>${initial}</span></div><div class="seam"></div>`;
  return card;
}
for(const [name,width] of Object.entries(widths)){
  const host=document.getElementById(name); groups[name]=[];
  for(let i=0;i<width;i++){const card=createCard("0");host.appendChild(card);groups[name].push(card);}
}
function snap(card,value){card.dataset.value=value;card.querySelectorAll("span").forEach(s=>s.textContent=value)}
function flip(card,next){
  const current=card.dataset.value;if(current===next)return;
  const staticTop=card.querySelector(".static-top span"),staticBottom=card.querySelector(".static-bottom span"),
  flipTop=card.querySelector(".flip-top span"),flipBottom=card.querySelector(".flip-bottom span");
  staticTop.textContent=next;staticBottom.textContent=current;flipTop.textContent=current;flipBottom.textContent=next;
  card.classList.remove("flipping");void card.offsetWidth;card.classList.add("flipping");
  setTimeout(()=>{staticBottom.textContent=next},280);
  setTimeout(()=>{card.classList.remove("flipping");snap(card,next)},590);
}
function remaining(){
  let diff=Math.max(0,target-Date.now());
  const days=Math.floor(diff/86400000);diff%=86400000;
  const hours=Math.floor(diff/3600000);diff%=3600000;
  const minutes=Math.floor(diff/60000);diff%=60000;
  const seconds=Math.floor(diff/1000);
  return {days:String(days).padStart(3,"0"),hours:String(hours).padStart(2,"0"),
  minutes:String(minutes).padStart(2,"0"),seconds:String(seconds).padStart(2,"0")};
}
function render(initial=false){
  const vals=remaining();
  for(const [name,str] of Object.entries(vals)){
    groups[name].forEach((card,i)=>initial?snap(card,str[i]):flip(card,str[i]));
  }
  const sr=document.getElementById("srStatus");
 
  if(Date.now()>=target){
    document.getElementById("dateLine").textContent="COMMENCEMENT DAY IS HERE";
    sr.textContent="Commencement Day is here.";
  } else {
    sr.textContent=`${parseInt(vals.days)} days, ${parseInt(vals.hours)} hours, ${parseInt(vals.minutes)} minutes until Commencement on May 17, 2027 at 11:00 AM.`;
  }
}
render(true);setInterval(()=>render(false),1000);
</script>

<script id="random-bokeh-positioning">
(() => {
  const lights = document.querySelectorAll(
    '#portrait-tv-rotation .clean-bokeh .light:not(.edge1):not(.edge2):not(.distant)'
  );
  if (!lights.length) return;
 
  /*
    Safe zones around the outer portions of the composition.
    This keeps the largest/random lights away from the central countdown
    and the primary Nighthawk focal area while still allowing natural variety.
  */
  const zones = [
    [3,24, 5,24],
    [27,43, 5,19],
    [58,73, 5,20],
    [77,95, 7,29],
    [2,20, 30,58],
    [80,96, 31,59],
    [3,22, 63,90],
    [27,42, 79,95],
    [59,73, 79,94],
    [80,96, 64,91]
  ];
 
  function place(light) {
    const z = zones[Math.floor(Math.random() * zones.length)];
    light.style.left = (z[0] + Math.random() * (z[1] - z[0])).toFixed(1) + '%';
    light.style.top  = (z[2] + Math.random() * (z[3] - z[2])).toFixed(1) + '%';
  }
 
  lights.forEach(light => {
    light.addEventListener('animationiteration', () => {
      /* Every standard bokeh cycle reaches opacity 0 before relocation. */
      place(light);
    });
  });
})();
</script>

  const DATE_MS=40000;
